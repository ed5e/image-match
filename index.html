<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Match — face & hand reaction matcher</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #15181d; --line: #262b33; --text: #e8eaed; --dim: #8a929e;
    --hud: #5dfc9b; --face: #ffd23f; --hand: #39e6ff; --accent: #ff5fa2;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font: 600 15px var(--mono); margin: 0; letter-spacing: .04em; }
  header h1 span { color: var(--hud); }
  header .spacer { flex: 1; }
  button, label.btn { font: 500 13px var(--mono); color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button:hover, label.btn:hover { border-color: var(--dim); }
  button:focus-visible, .slot:focus-visible { outline: 2px solid var(--hud); outline-offset: 2px; }
  button.primary { background: var(--hud); color: #06240f; border-color: var(--hud); font-weight: 700; }
  label.toggle { font: 13px var(--mono); color: var(--dim); display: flex; gap: 6px; align-items: center; cursor: pointer; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 18px; min-height: 0; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .pane { position: relative; background: #000; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3; display: grid; place-items: center; }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #start { position: relative; z-index: 2; text-align: center; padding: 20px; max-width: 34ch; }
  #start p { color: var(--dim); font-size: 13px; margin: 12px 0 0; }
  #start .err { color: #ff8a8a; }
  .hud { position: absolute; top: 10px; right: 10px; z-index: 3; font: 600 13px var(--mono); color: var(--hud); background: rgba(0,0,0,.72); border: 1px solid var(--hud); padding: 6px 10px; border-radius: 4px; white-space: pre; }
  .fps { position: absolute; left: 10px; bottom: 8px; z-index: 3; font: 11px var(--mono); color: #fff; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 3px; }
  .fps:empty { display: none; }

  #match { width: 100%; height: 100%; display: grid; place-items: center; background: #fff; }
  #match img { width: 100%; height: 100%; object-fit: contain; }
  #match .emoji { font-size: clamp(90px, 22vw, 240px); line-height: 1; filter: drop-shadow(0 8px 30px rgba(0,0,0,.6)); }
  #match.pop > * { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.86); opacity: .4; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #match.pop > * { animation: none; } }
  .caption { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font: 700 18px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: #111; z-index: 3; pointer-events: none; }

  footer { padding: 0 18px 18px; }
  footer h2 { font: 600 12px var(--mono); color: var(--dim); letter-spacing: .08em; text-transform: uppercase; margin: 4px 0 8px; }
  #slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .slot { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: left; color: var(--text); font: inherit; cursor: pointer; }
  .slot.active { border-color: var(--hud); box-shadow: 0 0 0 1px var(--hud); }
  .slot .thumb { height: 64px; border-radius: 5px; background: #000; display: grid; place-items: center; font-size: 36px; overflow: hidden; }
  .slot .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .slot b { display: block; font: 600 13px var(--mono); margin-top: 6px; }
  .slot small { display: block; color: var(--dim); font-size: 11.5px; line-height: 1.3; }
  .slot .x { position: absolute; top: 4px; right: 4px; font: 11px var(--mono); padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,.75); }
  .hint { color: var(--dim); font-size: 12.5px; margin: 10px 0 0; }
</style>
</head>
<body>

<header>
  <h1>IMAGE<span>/</span>MATCH</h1>
  <div class="spacer"></div>
  <label class="toggle"><input type="checkbox" id="showMesh" checked> tracking overlay</label>
  <button id="resetImgs" type="button">Reset images</button>
</header>

<main>
  <section class="pane" aria-label="Camera">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="start">
      <button class="primary" id="startBtn" type="button">Start camera</button>
      <p id="status">Video never leaves your computer — tracking runs in this browser tab.</p>
    </div>
    <div class="fps" id="fps"></div>
  </section>

  <section class="pane" aria-label="Matched image">
    <div class="hud" id="hud">Pose: —
Emotion: —</div>
    <div id="match"></div>
    <div class="caption" id="caption"></div>
  </section>
</main>

<footer>
  <h2>Reactions — click one to use your own image</h2>
  <div id="slots"></div>
  <p class="hint">Hand gestures win over facial expressions. Hold a pose for a moment and the image swaps. Your uploaded images are stored only in this browser.</p>
  <input type="file" id="file" accept="image/*" hidden>
</footer>

<script type="module">

const STORE = 'mirror-match-images-v2';
let custom = {};
const imgFor = (id) => custom[id] || DEFAULT_IMAGES[id];
try { custom = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch { custom = {}; }
const saveCustom = () => { try { localStorage.setItem(STORE, JSON.stringify(custom)); } catch { /* too big or unavailable: keep in memory */ } };

function renderSlots() {
  const wrap = $('slots');
  wrap.textContent = '';
  for (const r of REACTIONS) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'slot'; b.dataset.id = r.id;
    b.title = 'Click to choose an image for "' + r.id + '"';
    const thumb = document.createElement('div'); thumb.className = 'thumb';
    if (imgFor(r.id)) { const im = new Image(); im.src = imgFor(r.id); im.alt = ''; thumb.append(im); }
    else thumb.textContent = r.emoji;
    const name = document.createElement('b'); name.textContent = r.id;
    const how = document.createElement('small'); how.textContent = r.how;
    b.append(thumb, name, how);
    if (custom[r.id]) {
      const x = document.createElement('span'); x.className = 'x'; x.textContent = 'reset'; x.dataset.reset = r.id;
      b.append(x);
    }
    wrap.append(b);
  }
  markActive();
}
let pickingFor = null;
$('slots').addEventListener('click', (e) => {
  const reset = e.target.closest('[data-reset]');
  if (reset) { delete custom[reset.dataset.reset]; saveCustom(); renderSlots(); showReaction(current, true); return; }
  const slot = e.target.closest('.slot');
  if (slot) { pickingFor = slot.dataset.id; $('file').click(); }
});
$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !pickingFor) return;
  custom[pickingFor] = await shrink(f);
  saveCustom(); renderSlots(); showReaction(current, true);
});
$('resetImgs').addEventListener('click', () => { custom = {}; saveCustom(); renderSlots(); showReaction(current, true); });

/* Downscale uploads so they fit in browser storage. */
async function shrink(file, max = 640) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85);
}

/* ---------- Showing the match ---------- */
let current = 'neutral';
function markActive() {
  for (const el of document.querySelectorAll('.slot')) el.classList.toggle('active', el.dataset.id === current);
}
function showReaction(id, force = false) {
  if (id === current && !force) return;
  current = id;
  const m = $('match'); m.textContent = '';
  if (imgFor(id)) { const im = new Image(); im.src = imgFor(id); im.alt = id; m.append(im); }
  else { const d = document.createElement('div'); d.className = 'emoji'; d.textContent = byId[id].emoji; m.append(d); }
  m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop');
  $('caption').textContent = id;
  markActive();
}

/* ---------- Pose logic ---------- */
const dist = (a, b, ar) => Math.hypot((a.x - b.x) * ar, a.y - b.y);

function handShape(h, ar) {
  const w = h[0];
  const size = dist(h[0], h[9], ar) || 1e-6;                 // wrist → middle knuckle
  const ext = (tip, pip) => dist(h[tip], w, ar) > dist(h[pip], w, ar) * 1.15;
  const index = ext(8, 6), middle = ext(12, 10), ring = ext(16, 14), pinky = ext(20, 18);
  const thumb = dist(h[4], h[17], ar) > dist(h[2], h[17], ar) * 1.2;
  return {
    index, middle, ring, pinky, thumb,
    peace: index && middle && !ring && !pinky,
    thumbsUp: thumb && !index && !middle && !ring && !pinky && (h[2].y - h[4].y) > size * 0.35,
    fist: !index && !middle && !ring && !pinky,
    size,
  };
}

function classify(face, shapes, hands, ar) {
  const score = (n) => shapes?.find(c => c.categoryName === n)?.score ?? 0;
  let emotion = '—', facePose = null, dbg = '';
  if (face) {
    // Head turn: where the nose tip sits between the two cheek edges (0.5 = facing the camera).
    const yaw = (face[1].x - face[234].x) / ((face[454].x - face[234].x) || 1e-6);
    // Head tilt: where the nose tip sits between forehead and chin (smaller = looking up).
    const pitch = (face[1].y - face[10].y) / ((face[152].y - face[10].y) || 1e-6);
    dbg = 'yaw ' + (yaw - 0.5).toFixed(2) + '  pitch ' + pitch.toFixed(2);
    const smile = (score('mouthSmileLeft') + score('mouthSmileRight')) / 2;
    const frown = (score('mouthFrownLeft') + score('mouthFrownRight')) / 2;
    const closed = Math.min(score('eyeBlinkLeft'), score('eyeBlinkRight'));
    if (Math.abs(yaw - 0.5) > T.yaw)                          { emotion = 'looking away'; facePose = 'side'; }
    else if (score('jawOpen') > T.jawOpen)                    { emotion = 'silly';        facePose = 'bleh'; }
    else if (pitch < T.pitchUp)                               { emotion = 'unbothered';   facePose = 'up'; }
    else if (smile > T.smile)                                 { emotion = 'happy';        facePose = 'happy'; }
    else if (closed > T.eyesClosed)                           { emotion = 'unbothered';   facePose = 'up'; }
    else if (frown > T.frown || score('mouthShrugLower') > T.shrug) { emotion = 'sad';    facePose = 'sad'; }
    else                                                      { emotion = 'neutral';      facePose = 'neutral'; }
  }
  let pose = null;
  if (hands.length >= 2) {
    const [a, b] = hands, size = (dist(a[0], a[9], ar) + dist(b[0], b[9], ar)) / 2;
    if (dist(a[8], b[8], ar) < size * T.heartGap && dist(a[4], b[4], ar) < size * T.heartGap) pose = 'heart';
  }
  if (!pose && hands.length) {
    const s = hands.map(h => handShape(h, ar));
    const faceH = face ? dist(face[10], face[152], ar) : 0;
    if (s.some(x => x.peace)) pose = 'peace';
    else if (face && hands.some((h, i) => s[i].index && !s[i].middle && dist(h[8], face[13], ar) < faceH * T.lipReach)) pose = 'shh';
    else if (s.some(x => x.thumbsUp)) pose = 'thumbs';
    else if (hands.some((h, i) => s[i].fist && (!face || h[9].y < face[152].y))) pose = 'flex';
  }
  // No face and no gesture (e.g. turned to full profile): id is null and the current image stays.
  return { id: pose || facePose, pose: pose || 'none', emotion, dbg };
}

/* ---------- Tracking loop ---------- */
let faceLm, handLm, draw, FaceLandmarker, HandLandmarker;
let fpsNow = 0, dbgText = '', candidate = null, held = 0, lastT = -1, frames = 0, fpsT = performance.now();

function frame() {
  requestAnimationFrame(frame);
  if (video.readyState < 2 || video.currentTime === lastT) return;
  lastT = video.currentTime;
  if (canvas.width !== video.videoWidth) { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
  const now = performance.now();
  const fr = faceLm.detectForVideo(video, now);
  const hr = handLm.detectForVideo(video, now);
  const face = fr.faceLandmarks?.[0], hands = hr.landmarks ?? [];

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if ($('showMesh').checked) {
    if (face) {
      // Simple outline: face oval, brows, eyes and lips, plus a few key points — same style as the hands.
      const line = { color: '#ffd23f', lineWidth: 2.5 };
      for (const part of ['FACE_OVAL', 'LEFT_EYEBROW', 'RIGHT_EYEBROW', 'LEFT_EYE', 'RIGHT_EYE', 'LIPS'])
        draw.drawConnectors(face, FaceLandmarker['FACE_LANDMARKS_' + part], line);
      draw.drawLandmarks([1, 10, 152, 234, 454, 61, 291, 33, 263].map(i => face[i]), { color: '#ff5fa2', radius: 3 });
    }
    for (const h of hands) {
      draw.drawConnectors(h, HandLandmarker.HAND_CONNECTIONS, { color: '#39e6ff', lineWidth: 3 });
      draw.drawLandmarks(h, { color: '#ff5fa2', radius: 3 });
    }
  }

  const res = classify(face, fr.faceBlendshapes?.[0]?.categories, hands, canvas.width / canvas.height);
  // Debounce: a new pose must hold for a few frames before the image swaps.
  if (res.id) {
    if (res.id === candidate) held++; else { candidate = res.id; held = 1; }
    if (held >= T.holdFrames) showReaction(res.id);
  }
  dbgText = res.dbg;
  $('hud').textContent = 'Pose: ' + (res.pose === 'none' ? current : res.pose) + '\nEmotion: ' + res.emotion;

  frames++;
  if (now - fpsT > 1000) { fpsNow = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
  $('fps').textContent = fpsNow + ' fps  ' + dbgText;
}

async function start() {
  const status = $('status'), btn = $('startBtn');
  btn.disabled = true; status.className = '';
  try {
    status.textContent = 'Loading tracking models (a few MB, first run only)…';
    const vision = await import(VISION + '/vision_bundle.mjs');
    ({ FaceLandmarker, HandLandmarker } = vision);
    const files = await vision.FilesetResolver.forVisionTasks(VISION + '/wasm');
    const make = async (Cls, model, extra) => {
      const opts = (delegate) => ({ baseOptions: { modelAssetPath: model, delegate }, runningMode: 'VIDEO', ...extra });
      try { return await Cls.createFromOptions(files, opts('GPU')); }
      catch { return await Cls.createFromOptions(files, opts('CPU')); }
    };
    faceLm = await make(FaceLandmarker, FACE_MODEL, { numFaces: 1, outputFaceBlendshapes: true });
    handLm = await make(HandLandmarker, HAND_MODEL, { numHands: 2 });
    draw = new vision.DrawingUtils(ctx);

    status.textContent = 'Waiting for camera permission…';
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 960 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
    video.srcObject = stream;
    await video.play();
    $('start').hidden = true;
    showReaction('neutral', true);
    frame();
  } catch (err) {
    console.error(err);
    btn.disabled = false; status.className = 'err';
    const name = err?.name || '';
    status.textContent =
      name === 'NotAllowedError' ? 'Camera access was blocked. Allow the camera for this page in your browser, then try again.' :
      name === 'NotFoundError' ? 'No camera found on this device.' :
      !navigator.mediaDevices ? 'This browser only allows the camera on http://localhost or https. See the README for the one-line local server.' :
      'Could not start: ' + (err?.message || err) + ' — check your internet connection (models load from the web) and try again.';
  }
}
$('startBtn').addEventListener('click', start);
renderSlots();
showReaction('neutral', true);
</script>
</body>
</html>
